name: Deploy Images

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/deploy-images.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-west-1
  CLUSTER_NAME: dpp-cluster
  ECR_REGISTRY: 399078540634.dkr.ecr.us-west-1.amazonaws.com

# Least-privilege token scope. id-token is what lets the job request an OIDC
# token from GitHub to exchange for temporary AWS credentials — no stored keys.
permissions:
  id-token: write
  contents: read

# A second push while a deploy is running cancels the older run rather than
# racing it, so the newest commit always wins.
concurrency:
  group: deploy-images
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, push, and roll out
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tag with the commit SHA rather than only :latest. Immutable tags mean a
      # rollout points at one exact build, and `kubectl rollout undo` is meaningful.
      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: ./services/processor
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/dpp-worker:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/dpp-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/dpp-api:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/dpp-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Roll out new images
        run: |
          kubectl set image deployment/dpp-worker \
            dpp-worker="$ECR_REGISTRY/dpp-worker:${{ github.sha }}"
          kubectl set image deployment/dpp-api \
            dpp-api="$ECR_REGISTRY/dpp-api:${{ github.sha }}"

      # The API is always on, so a real rollout happens and is worth waiting on.
      # The worker sits at 0 replicas under KEDA control, so there is nothing to
      # wait for — its new image is picked up the next time KEDA scales it up.
      - name: Wait for API rollout
        run: kubectl rollout status deployment/dpp-api --timeout=180s

      - name: Deployed image digests
        run: |
          kubectl get deployment dpp-api -o jsonpath='{.spec.template.spec.containers[0].image}'; echo
          kubectl get deployment dpp-worker -o jsonpath='{.spec.template.spec.containers[0].image}'; echo
